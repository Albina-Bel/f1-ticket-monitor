name: Check F1 Madrid tickets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of checking the page"
        type: boolean
        default: false

concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo (anonymous)
        uses: actions/checkout@v5
        with:
          token: ""

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore previous state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ticket-state

      - name: Run availability check
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          if [[ "${{ inputs.test_email }}" == "true" ]]; then
            python check.py --test-email
          else
            python check.py
          fi

      - name: Delete previous cache (so we can overwrite key)
        if: always() && steps.restore-state.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/caches?key=ticket-state \
            || echo "cache delete failed (non-fatal)"

      - name: Save updated state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ticket-state
