name: Check F1 Madrid tickets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of checking the page"
        type: boolean
        default: false

concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Download script (anonymous raw fetch)
        run: |
          curl -fsSL -o check.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/check.py"
          ls -la check.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore previous state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ticket-state-placeholder
          restore-keys: |
            ticket-state-

      - name: Run availability check
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          if [[ "${{ inputs.test_email }}" == "true" ]]; then
            python check.py --test-email
          else
            python check.py
          fi

      - name: Save updated state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ticket-state-${{ github.run_id }}-${{ github.run_attempt }}
